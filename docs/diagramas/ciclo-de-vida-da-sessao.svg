<svg xmlns="http://www.w3.org/2000/svg" width="1074.1" height="310" viewBox="10 10 1074.1 310" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
<title>Ciclo de vida do conector</title>
<defs>
<marker id="m-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#000000" stroke-width="1.3"/></marker>
<marker id="m-arrow-filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#000000" stroke="#000000" stroke-width="1"/></marker>
<marker id="m-triangle" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L15 8 L1 15 z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/></marker>
<marker id="m-diamond" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 6 L10 1 L19 6 L10 11 z" fill="#ffffff" stroke="#000000" stroke-width="1.3"/></marker>
<marker id="m-diamond-filled" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 6 L10 1 L19 6 L10 11 z" fill="#000000" stroke="#000000" stroke-width="1.3"/></marker>
</defs>
<rect x="10" y="10" width="1074.1" height="310" fill="#ffffff"/>
<g data-id="el-inicio" data-type="initial">
<circle cx="52" cy="152" r="12" fill="#000000"/>
</g>
<g data-id="el-registrado" data-type="state">
<rect x="200" y="120" width="160" height="70" rx="12" ry="12" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="280" y="139" text-anchor="middle" fill="#000000" font-weight="600">Registrado</text>
<line x1="200" y1="148" x2="360" y2="148" stroke="#000000" stroke-width="1.3"/>
<text x="210" y="163" text-anchor="start" font-size="11" fill="#000000">entry / valida namespace e esquemas de tools</text>
<text x="210" y="179.5" text-anchor="start" font-size="11" fill="#000000">do / aguarda sinal de inicialização</text>
</g>
<g data-id="el-ativo" data-type="state">
<rect x="460" y="120" width="160" height="70" rx="12" ry="12" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="540" y="139" text-anchor="middle" fill="#000000" font-weight="600">Ativo / Pronto</text>
<line x1="460" y1="148" x2="620" y2="148" stroke="#000000" stroke-width="1.3"/>
<text x="470" y="163" text-anchor="start" font-size="11" fill="#000000">entry / Initialize(ctx) autentica API/sessão</text>
<text x="470" y="179.5" text-anchor="start" font-size="11" fill="#000000">do / atende requisições de tools/call</text>
</g>
<g data-id="el-executando" data-type="state">
<rect x="720" y="40" width="160" height="70" rx="12" ry="12" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="800" y="59" text-anchor="middle" fill="#000000" font-weight="600">Executando Tool</text>
<line x1="720" y1="68" x2="880" y2="68" stroke="#000000" stroke-width="1.3"/>
<text x="730" y="83" text-anchor="start" font-size="11" fill="#000000">entry / despacha args via Handler(ctx)</text>
<text x="730" y="99.5" text-anchor="start" font-size="11" fill="#000000">do / aplica token budgeting e minificação</text>
</g>
<g data-id="el-encerrado" data-type="state">
<rect x="720" y="220" width="160" height="70" rx="12" ry="12" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="800" y="239" text-anchor="middle" fill="#000000" font-weight="600">Encerrado</text>
<line x1="720" y1="248" x2="880" y2="248" stroke="#000000" stroke-width="1.3"/>
<text x="730" y="263" text-anchor="start" font-size="11" fill="#000000">entry / Close() desconecta sockets e persiste sessão</text>
</g>
<g data-id="el-fim" data-type="final">
<circle cx="994" cy="154" r="13.3" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<circle cx="994" cy="154" r="9" fill="#000000"/>
</g>
<g data-id="rel-1" data-type="transition">
<path d="M64 152.2 L200 153.9" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#m-arrow)"/>
<text x="132" y="147.1" text-anchor="middle" font-size="11" fill="#000000" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">boot do hub</text>
</g>
<g data-id="rel-2" data-type="transition">
<path d="M360 155 L460 155" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#m-arrow)"/>
<text x="410" y="149" text-anchor="middle" font-size="11" fill="#000000" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">modulo habilitado via flag/env / Initialize()</text>
</g>
<g data-id="rel-3" data-type="transition">
<path d="M620 130.4 L720 99.6" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#m-arrow)"/>
<text x="670" y="109" text-anchor="middle" font-size="11" fill="#000000" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">chamada MCP ou HTTP / inicia timeout context</text>
</g>
<g data-id="rel-4" data-type="transition">
<path d="M720 99.6 L620 130.4" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#m-arrow)"/>
<text x="670" y="109" text-anchor="middle" font-size="11" fill="#000000" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">resposta entregue ao cliente</text>
</g>
<g data-id="rel-5" data-type="transition">
<path d="M620 185.8 L720 224.2" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#m-arrow)"/>
<text x="670" y="199" text-anchor="middle" font-size="11" fill="#000000" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">SIGINT / SIGTERM / Close()</text>
</g>
<g data-id="rel-6" data-type="transition">
<path d="M867.2 220 L981.6 160.5" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#m-arrow)"/>
</g>
</svg>
